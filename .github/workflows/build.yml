name: Build Habit Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Habit_Tracker_GitHub_Actions_Builder_FIXED_MENU_DELETE_FIXED.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -type f | head -1)")
          echo "Project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          sed -i "/android {/a\    namespace 'com.example.habittracker'" app/build.gradle
          ls -la
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habit-Tracker-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
